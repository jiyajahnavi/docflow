[project]
name = "docflow"
version = "0.1.0"
description = "Employee Management System with FastAPI, Google OAuth, and MySQL"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "itsdangerous>=2.2.0",
    "email-validator>=2.2.0",
]
